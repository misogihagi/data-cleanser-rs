name: Rust Data Generation and Commit

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering if needed

jobs:
  generate_and_commit_data:
    # Use an Ubuntu runner for reliable Rust and Git operations
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code (main branch)
        uses: actions/checkout@v4
        with:
          # Fetches all history for the target branch switch later
          fetch-depth: 0 

      - name: 2. Install Rust Toolchain
        # Using the standard action for setting up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 3. Compile and Execute Rust Program
        id: run_rust
        run: |
          # ---
          # 🚨 IMPORTANT: Replace the lines below with your actual Rust build/run commands.
          # Ensure your Rust program outputs the result file(s) into a known location (e.g., 'generated_data').
          # ---
          
          echo "Running Rust execution..."
          
          # Example: Create a directory for generated files
          mkdir -p generated_data
          
          # Example: Run your program and pipe output, or ensure it generates the required file.
          # If your project uses cargo:
          # cargo run --release -- --output generated_data/output.txt
          
          # For demonstration, we just create a file with the execution timestamp
          RUST_OUTPUT="Data generated by Rust on $(date)"
          echo "$RUST_OUTPUT" > generated_data/output.txt
          
          echo "::set-output name=data_file::generated_data/output.txt"

      - name: 4. Configure Git
        # Set up the bot identity for the commit
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: 5. Checkout/Create 'data' branch
        run: |
          # Fetch the target branch, then switch to it (or create it if it doesn't exist)
          git fetch origin data
          git checkout -b data origin/data || git checkout --orphan data
          
          # The '--orphan' option creates a branch without any commit history,
          # which is often desired for data/deploy branches. If you want to keep
          # the history, use: 'git checkout data || git checkout -b data'

      - name: 6. Move Files, Commit, and Push
        # We use the GITHUB_TOKEN to perform the push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Copy the generated data to the root of the 'data' branch working directory
          cp generated_data/output.txt .
          
          # Clean up the intermediate directory
          rm -rf generated_data
          
          # Stage and commit
          git add output.txt
          
          # Check if there are actual changes before trying to commit
          if ! git diff --cached --exit-code; then
            echo "No changes detected in output.txt. Skipping commit."
          else
            echo "Changes detected. Committing and pushing..."
            git commit -m "Automated data update: $(date)"
            
            # Use --force-with-lease for safety when pushing to a data branch
            git push origin data
          fi
